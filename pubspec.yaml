name: my_media
description: "A professional church production toolkit built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  camera: ^0.11.0+2
  path_provider: ^2.1.3
  material_symbols_icons: ^4.2704.0
  provider: ^6.1.5+1
  video_player: ^2.11.1
  chewie: ^1.14.0
  rtmp_broadcaster: ^2.3.4
  record: ^6.2.0
  audioplayers: ^6.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#111317"
  adaptive_icon_foreground: "assets/images/logo.jpg"
